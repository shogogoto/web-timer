[tool.poetry]
name = "focus-timer"
version = "0.1.0"
description = "A small self-hosted study timer"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.0"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
jinja2 = "^3.1.6"
sqlalchemy = "^2.0.41"
python-multipart = "^0.0.20"
pwdlib = {extras = ["argon2"], version = "^0.2.1"}
itsdangerous = "^2.2.0"
pywebpush = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
