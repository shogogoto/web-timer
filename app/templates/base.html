<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101715" media="(prefers-color-scheme: dark)">
  <title>{% block title %}Focus Timer{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg?v={{ static_version }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script defer src="/static/alpine.min.js?v={{ static_version }}"></script>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
