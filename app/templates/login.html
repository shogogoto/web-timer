{% extends "base.html" %}
{% block title %}ログイン | Focus Timer{% endblock %}
{% block body %}
<main class="card login">
  <h1>Focus Timer</h1>
  <p class="login-lead">利用者を選んで開始</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="user-picker">
    {% for user in users %}
    <button type="submit" name="username" value="{{ user.username }}">{{ user.username }}</button>
    {% else %}
    <p class="muted">利用者がまだ登録されていません。</p>
    {% endfor %}
  </form>
  <a class="admin-login-link" href="/admin/login">管理者ログイン</a>
</main>
{% endblock %}
